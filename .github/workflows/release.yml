name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Paratranz-Mod-Checker-windows.zip
          - os: ubuntu-latest
            artifact_name: Paratranz-Mod-Checker-linux.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Paratranz Mod Checker" --icon="assets\icon.png" --add-data "ui;ui" --add-data "assets;assets" main.py
          Compress-Archive -Path "dist/Paratranz Mod Checker" -DestinationPath "Paratranz-Mod-Checker-windows.zip"

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Paratranz Mod Checker" --icon="assets/icon.png" --add-data "ui:ui" --add-data "assets:assets" main.py
          cd dist && tar -czvf ../Paratranz-Mod-Checker-linux.tar.gz "Paratranz Mod Checker" && cd ..

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
